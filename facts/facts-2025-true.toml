title = "Rechargeable Batteries Are Reversible Chemistry"
text = """
A lithium-ion battery works by shuttling lithium ions between materials, storing energy as chemical potential and releasing it as electricity.
It is a controlled, repeatable reaction - designed to run forward and backward thousands of times.
"""
