[[facts]]
title = "Winter in the North - Tilt vs Distance."
text = """
Winter in the northern hemisphere is not caused by Earth being farther from the Sun.
Earth is actually closest to the Sun in early January (perihelion).
Distance does matter: Earth receives about $\\sim 7\\%$ more solar energy at perihelion than at aphelion.
But tilt dominates: in upstate New York, daylight is about 15.37 hours around the June solstice and about 9.05 hours around the December solstice.
That's ~$\\sim 70\\%$ more time collecting sunlight in summer - before even counting that summer sunlight also arrives more directly.
"""
references = """
https://www.pbs.org/video/the-earth-a-tilt-for-all-seasons-obt6lv
https://spaceplace.nasa.gov/seasons/en/
https://aa.usno.navy.mil/faq/seasons_orbit
"""



[[facts]]
title = "Euler's Formula"
text = """
Euler's formula says
\\[
e^{i\\theta} = \\cos(\\theta) + i\\sin(\\theta)
\\]
It is not a coincidence or a definition - it is a theorem that drops out of the power series for the exponential, sine, and cosine:
\\[
e^x = \\sum_{n=0}^{\\infty} \\frac{x^n}{n!},\\quad
\\sin(x) = \\sum_{n=0}^{\\infty} (-1)^n \\frac{x^{2n+1}}{(2n+1)!},\\quad
\\cos(x) = \\sum_{n=0}^{\\infty} (-1)^n \\frac{x^{2n}}{(2n)!}
\\]
Plugging in $x = i\\theta$ and using $i^2=-1$ makes the even terms become $\\cos(\\theta)$ and the odd terms become $i\\sin(\\theta)$.
A single identity turns rotation into exponentiation - which is why complex numbers are the natural language of waves, circuits, and quantum mechanics.

If you plug in $\\theta=\\pi$, you get what many consider to be the most beautiful equation in mathematics:
\\[
e^{i\\pi} + 1 = 0
\\]
Euler's identity: a single exact equation linking $0$, $1$, $e$, $i$, and $\\pi$.
"""
references = """
https://www.youtube.com/watch?v=mvmuCPvRoWQ # 3blue1brown
https://en.wikipedia.org/wiki/Euler%27s_formula
https://mathworld.wolfram.com/EulersFormula.html
"""


[[facts]]
title = "Imaginary Numbers Are a Mathematical Scaffold"
text = """
Complex numbers were not invented to be weird - they were invented to make algebra complete.
In the 1500s, mathematicians found that solving some cubic equations forces you to pass through $\\sqrt{-1}$,
even when the final answers are perfectly real.
This is called the \\emph{casus irreducibilis}: sometimes the only path to real solutions goes through complex ones.
Imaginary numbers began as a temporary scaffold that made certain problems solvable - and today they are foundational to physics and engineering.
"""
references = """
https://www.youtube.com/watch?v=cUzklzVXJwo   # veritasium
https://en.wikipedia.org/wiki/Casus_irreducibilis
https://en.wikipedia.org/wiki/Complex_number
"""


[[facts]]
title = "Deflecting an Asteroid Is Real Engineering"
text = """
Humanity has already tested a real method for deflecting an asteroid.
In 2022, NASA's DART mission intentionally crashed a spacecraft into the asteroid moonlet Dimorphos and measurably changed its orbit.
The orbital period shortened by about $32$ minutes (far beyond the mission's success threshold).
Planetary defense is not magic: it is early detection + predictable physics + enough time to act.
"""
references = """
https://www.youtube.com/watch?v=4Wrc4fHSCpw  # veritasium
https://www.nasa.gov/news-release/nasa-confirms-dart-mission-impact-changed-asteroids-motion-in-space/
https://en.wikipedia.org/wiki/Double_Asteroid_Redirection_Test
"""



[[facts]]
title = "Black Holes and the Scientific Method"
text = """
One of the strongest demonstrations of scientific rigor is that LIGO confirmed a black-hole merger using two detectors,
independent analysis pipelines, and statistical significance.
The first direct gravitational-wave event, GW150914, was detected on September 14, 2015 and announced in February 2016.
The signal matched general relativity's predictions, and the estimated false-alarm rate was less than 1 event per $203{,}000$ years.
Extraordinary claims require extraordinary evidence - and sometimes extraordinary instrumentation.
"""
references = """
https://www.youtube.com/watch?v=ViMnGgn87dg  # veritasium
https://arxiv.org/abs/1602.03837
https://www.ligo.caltech.edu/page/press-release-gw150914
"""


[[facts]]
title = "The Internet Is Not Forever"
text = """
The internet feels permanent, but it isn't.
As of 2023 (measured by Pew using Common Crawl), about $38\\%$ of webpages that existed in 2013 were no longer accessible a decade later.
Even within the 2013-2023 period overall, about a quarter of pages that existed at some point were gone by 2023.
All information decays unless we actively preserve it.
If we want knowledge to last, it has to be made redundant - archived in multiple places, across multiple systems.
"""
references = """
https://www.youtube.com/watch?v=jh98N46DM5k  # bbc on internet archive
https://www.pewresearch.org/data-labs/2024/05/17/when-online-content-disappears/
https://www.pewresearch.org/wp-content/uploads/sites/20/2024/05/pl_2024.05.17_link-rot_report.pdf
"""
