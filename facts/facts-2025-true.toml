title = "Quantum Mechanics Runs Your Phone"
text = """
Your phone's processor depends on quantum mechanics being stable and repeatable.
Transistors work because electrons occupy quantized energy states in semiconductors.
Modern life runs on a theory that began as an attempt to explain why hot objects glow.
