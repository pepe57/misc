[[facts]]
title = "Chips Are Logic Etched into Silicon"
text = """
A computer chip works because we can control where electrons can and cannot flow inside silicon.
By doping semiconductors and carving patterns with lithography, we build billions of switches - each one a physical object obeying quantum rules.
We don't just ``use electricity''.
We sculpt pathways for charge at microscopic scales, and logic emerges from geometry.
"""
