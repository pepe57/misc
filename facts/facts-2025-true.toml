set_title = "Facts 2025"
year = 2025


[[facts]]
title = "Phones Outnumber People"
text = """
As of 2025, there are roughly $\\sim 7.2$ billion smartphones in existence, but only about $\\sim 4.7$-$5.0$ billion people use one.
Many people own multiple devices, and globally there are even more mobile subscriptions than people.

A smartphone is a pocket-sized cathedral of engineering: radios, GPS timing, photon-counting cameras, and chips etched at microscopic scales - all cooperating so you can send a message across the planet.
"""
references = """
https://explodingtopics.com/blog/smartphone-stats
https://backlinko.com/smartphone-usage-statistics
"""

[[facts]]
title = "Wi-Fi Fights Noise with Math"
text = """
Wireless communication works because we intentionally add redundancy.
Error-correcting codes let receivers reconstruct information even when bits are flipped by noise and interference.
The air is hostile to information - and using math it can be repaired efficiently.
"""
references = """
https://en.wikipedia.org/wiki/Error_correction_code
https://en.wikipedia.org/wiki/Channel_coding
"""


[[facts]]
title = "The Internet Is a Stack of Agreements"
text = """
The internet is not a single invention; it is a stack of agreements.
DNS maps names to addresses, routing protocols move packets, and TLS encryption lets strangers exchange secrets safely on public wires.
Billions of devices work together because they follow shared protocols.
"""
references = """
https://www.youtube.com/watch?v=86cQJ0MMses  # computerphile TLS Handshake Explained
https://en.wikipedia.org/wiki/Internet_protocol_suite
https://en.wikipedia.org/wiki/Domain_Name_System
"""


[[facts]]
title = "Security Is a People Problem"
text = """
You can have near-perfect cryptography and still be insecure if you manage keys badly.
Many real-world security failures come from implementation mistakes, leaked credentials, phishing, and side channels - not broken math.
The hardest part of security is the part made of people.
"""
references = """
https://en.wikipedia.org/wiki/Cryptographic_key
https://en.wikipedia.org/wiki/Side-channel_attack
https://en.wikipedia.org/wiki/Phishing
"""


[[facts]]
title = "Photos Are Photon Counts"
text = """
Every phone photo begins as a physical measurement: counting photons - particles of light.
Millions of tiny sensors collect electric charge proportional to incoming photons, then convert that charge into numbers.
The image you see is a reconstruction of the light pattern observed in that moment of reality.
"""
references = """
https://www.youtube.com/watch?v=4tV0nld2BKc
https://en.wikipedia.org/wiki/Image_sensor
https://en.wikipedia.org/wiki/CMOS_sensor
"""

