[[facts]]
title = "We Can Measure the Universe Expanding"
text = """
We know the universe is expanding because we can measure the color shift of light from galaxies.
Astronomers break down galaxy light into a spectrum and look for familiar ``fingerprints'' (spectral lines) from atoms like hydrogen.
When those lines appear at longer wavelengths (redshift), it reveals how much space has stretched while the light traveled to us.
"""
references = """
https://science.nasa.gov/asset/hubble/redshift-and-measuring-distance-to-remote-galaxies/
https://en.wikipedia.org/wiki/Redshift
https://en.wikipedia.org/wiki/Hubble%27s_law
"""


[[facts]]
title = "We Can Map the Universe in 3D"
text = """
Astronomers build 3D maps of the universe by combining a galaxy's position on the sky with its measured redshift.
Redshift surveys have measured the distances to millions of galaxies.
Humanity has turned faint smudges of light into a measurable cosmic structure.
"""
references = """
https://en.wikipedia.org/wiki/Redshift_survey
"""


