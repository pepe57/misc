[[facts]]
title = "A Simple Problem Nobody Can Solve: 3n + 1"
text = """
The Collatz conjecture is an unsolved problem that can be explained to a child.
Take any positive integer n: if n is even divide by 2; if odd replace it with 3n+1.
No one has proven that every starting number eventually reaches 1, even though it has been checked computationally for enormous ranges.
Simple rules can produce truths we still cannot reach.
"""
references = """
https://www.veritasium.com/videos/2021/7/30/the-simplest-math-problem-no-one-can-solve
https://en.wikipedia.org/wiki/Collatz_conjecture
"""


[[facts]]
title = "Railroads Store Heat as Stress"
text = """
Many railways use continuous welded rail with no gaps.
When temperature changes, the steel cannot freely expand and contract - so it stores that expansion as internal stress.

A seasonal change becomes a structural engineering problem:
fasteners, ballast, and careful design prevent ``sun kinks'' and keep trains running safely at continental scale.
"""
references = """
https://www.youtube.com/watch?v=Rdj5-6t6QI8 # Veritasium
https://en.wikipedia.org/wiki/Continuous_welded_rail
https://en.wikipedia.org/wiki/Railway_track#Thermal_expansion
"""


